quarkus.application.name=lab-identity
quarkus.http.port=8080
%dev.quarkus.http.port=17280
quarkus.oidc.auth-server-url=${LAB_KEYCLOAK_URL:http://localhost:17180}/realms/lab
quarkus.oidc.discovery-enabled=false
quarkus.oidc.authorization-path=https://auth.lab.test/realms/lab/protocol/openid-connect/auth
quarkus.oidc.token-path=/protocol/openid-connect/token
quarkus.oidc.jwks-path=/protocol/openid-connect/certs
quarkus.oidc.token.issuer=https://auth.lab.test/realms/lab
quarkus.oidc.client-id=lab-identity
quarkus.oidc.credentials.secret=${LAB_IDENTITY_OIDC_CLIENT_SECRET}
quarkus.oidc.application-type=web-app
quarkus.oidc.authentication.redirect-path=/auth/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
quarkus.oidc.authentication.pkce-required=true
quarkus.oidc.authentication.state-secret=${LAB_IDENTITY_STATE_SECRET}
quarkus.oidc.authentication.cookie-force-secure=true
quarkus.oidc.authentication.cookie-same-site=lax
quarkus.oidc.authentication.java-script-auto-redirect=false
quarkus.oidc.roles.source=accesstoken
quarkus.oidc.roles.role-claim-path=resource_access/lab-identity-api/roles
quarkus.oidc.authentication.verify-access-token=true
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.token.refresh-token-time-skew=10S
quarkus.oidc.end-session-path=https://auth.lab.test/realms/lab/protocol/openid-connect/logout
quarkus.oidc.logout.path=/auth/logout
quarkus.oidc.logout.post-logout-path=/auth/post-logout
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.redis.hosts=${LAB_IDENTITY_REDIS_URL:redis://localhost:16380}
quarkus.rest-csrf.create-token-path=/api/v1/session
quarkus.rest-csrf.cookie-name=lab-identity-csrf
quarkus.rest-csrf.cookie-http-only=true
quarkus.rest-csrf.cookie-force-secure=true
quarkus.rest-csrf.token-header-name=X-CSRF-TOKEN
quarkus.rest-csrf.token-signature-key=${LAB_IDENTITY_CSRF_SECRET}
quarkus.rest-csrf.require-form-url-encoded=true
quarkus.http.auth.permission.application.paths=/api/v1/*
quarkus.http.auth.permission.application.policy=application
quarkus.http.auth.policy.application.roles-allowed=app-user
quarkus.http.auth.permission.session.paths=/api/v1/session
quarkus.http.auth.permission.session.policy=permit
lab.keycloak.url=${LAB_KEYCLOAK_URL:http://localhost:17180}
lab.keycloak.admin-secret=${LAB_IDENTITY_ADMIN_CLIENT_SECRET}
quarkus.otel.exporter.otlp.endpoint=${LAB_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.sdk.disabled=${LAB_OTEL_DISABLED:true}
quarkus.otel.traces.suppress-application-uris=auth*,api/v1/admin*,api/v1/profile*
%dev.quarkus.log.console.json.enabled=false
%test.quarkus.log.console.json.enabled=false
%test.quarkus.otel.sdk.disabled=true
%test.quarkus.oidc.enabled=true
%test.quarkus.oidc.auth-server-url=${lab.keycloak.url}/realms/lab
%test.quarkus.redis.devservices.enabled=false
%test.quarkus.http.test-port=0
%test.quarkus.rest-csrf.cookie-force-secure=false
%test.quarkus.oidc.credentials.secret=test-only-client-secret-of-at-least-32-characters
%test.quarkus.oidc.authentication.state-secret=test-only-state-secret-of-at-least-32-characters
%test.quarkus.rest-csrf.token-signature-key=test-only-csrf-signing-secret-of-at-least-32-characters
%test.lab.keycloak.admin-secret=test-only-service-account-secret
