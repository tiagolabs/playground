apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hero-association
resources:
  - ../../base
patches:
  - target:
      kind: Deployment
      name: core
    path: core.yaml
  - target:
      kind: Deployment
      name: bff
    path: bff.yaml
  - target:
      kind: Deployment
      name: expedition
    path: expedition.yaml
