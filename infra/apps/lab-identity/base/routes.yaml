apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: lab-identity, namespace: lab-identity}
spec:
  parentRefs:
    - {name: cluster-lab, namespace: gateway-system, sectionName: https}
  hostnames: [identity.lab.test]
  rules:
    - matches:
        - {path: {type: PathPrefix, value: /api}}
        - {path: {type: PathPrefix, value: /auth}}
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - {name: X-Forwarded-Host, value: identity.lab.test}
              - {name: X-Forwarded-Proto, value: https}
              - {name: X-Forwarded-Port, value: "443"}
      backendRefs: [{name: backend, port: 8080}]
    - backendRefs: [{name: frontend, port: 8080}]
