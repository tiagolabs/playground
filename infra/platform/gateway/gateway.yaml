apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: tiagolabs-local-envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tiagolabs-local
  namespace: gateway-system
spec:
  gatewayClassName: tiagolabs-local-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              lab.test/gateway: "true"
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tiagolabs-local-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              lab.test/gateway: "true"
    - name: e2e-app
      hostname: app.e2e.heroassociation.test
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tiagolabs-local-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              heroassociation.test/e2e-gateway: "true"
    - name: e2e-auth
      hostname: auth.e2e.heroassociation.test
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: tiagolabs-local-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              heroassociation.test/e2e-gateway: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redirect-to-https
  namespace: gateway-system
spec:
  parentRefs:
    - name: tiagolabs-local
      sectionName: http
  hostnames:
    - heroassociation.test
    - auth.lab.test
    - identity.lab.test
    - pix.lab.test
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            statusCode: 301
