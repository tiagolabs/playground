apiVersion: v1
kind: ServiceAccount
metadata: {name: lab-deployer, namespace: hero-association}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: application-deployer, namespace: hero-association}
rules:
  - apiGroups: [""]
    resources: [services, configmaps, secrets, persistentvolumeclaims, pods, pods/log, pods/exec, events, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.envoyproxy.io]
    resources: [backendtrafficpolicies, securitypolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [security.istio.io]
    resources: [peerauthentications, authorizationpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: application-deployer, namespace: hero-association}
subjects:
  - kind: ServiceAccount
    name: lab-deployer
    namespace: hero-association
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: application-deployer}
