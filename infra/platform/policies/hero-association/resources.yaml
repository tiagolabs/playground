apiVersion: v1
kind: ResourceQuota
metadata: {name: application-budget, namespace: hero-association}
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 20Gi
    limits.memory: 64Gi
    pods: "80"
    services: "30"
    secrets: "30"
    configmaps: "30"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-defaults, namespace: hero-association}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 25m, memory: 64Mi}
      default: {memory: 512Mi}
