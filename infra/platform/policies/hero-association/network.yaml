# Permit only this application and its declared shared platform dependencies.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-boundary
  namespace: hero-association
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
      podSelector:
        matchLabels:
          app.kubernetes.io/component: proxy
          gateway.envoyproxy.io/owning-gateway-name: tiagolabs-local
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8083
    - protocol: TCP
      port: 8084
    - protocol: TCP
      port: 8085
    - protocol: TCP
      port: 8086
    - protocol: TCP
      port: 8087
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
    ports:
    - protocol: TCP
      port: 15020
    - protocol: TCP
      port: 15090
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: identity
      podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 8080
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: istio-system
      podSelector:
        matchLabels:
          app: istiod
    ports:
    - protocol: TCP
      port: 15012
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: observability
      podSelector:
        matchLabels:
          app: otel-lgtm
    ports:
    - protocol: TCP
      port: 4317
    - protocol: TCP
      port: 4318
  - to:
    - ipBlock:
        cidr: 172.16.0.0/12
        except: []
    - ipBlock:
        cidr: 192.168.0.0/16
        except: []
    - ipBlock:
        cidr: 10.0.0.0/8
        except:
        - 10.42.0.0/16
        - 10.43.0.0/16
    ports:
    - protocol: TCP
      port: 15172
    - protocol: TCP
      port: 17080
    - protocol: TCP
      port: 17081
    - protocol: TCP
      port: 17083
    - protocol: TCP
      port: 17084
    - protocol: TCP
      port: 17085
    - protocol: TCP
      port: 17086
    - protocol: TCP
      port: 17087
