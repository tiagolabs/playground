apiVersion: v1
kind: ResourceQuota
metadata: {name: application-budget, namespace: pix-integration}
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.memory: 8Gi
    pods: "20"
    services: "30"
    secrets: "30"
    configmaps: "30"
    persistentvolumeclaims: "10"
---
apiVersion: v1
kind: LimitRange
metadata: {name: container-defaults, namespace: pix-integration}
spec:
  limits:
    - type: Container
      defaultRequest: {cpu: 25m, memory: 64Mi}
      default: {memory: 512Mi}
