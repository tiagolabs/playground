jenkins:
  systemMessage: "Shared lab CI: project-owned build and deploy jobs on the WSL agent."
  numExecutors: 0
  slaveAgentPort: -1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  nodes:
    - permanent:
        name: wsl-local
        labelString: wsl-local
        numExecutors: 1
        remoteFS: "${JENKINS_AGENT_WORKDIR}"
        launcher:
          inbound:
            workDirSettings:
              disabled: false
              failIfWorkDirIsMissing: false
              internalDir: remoting
              workDirPath: "${JENKINS_AGENT_WORKDIR}"


jobs:
  - file: /var/jenkins_jobs/hero-association.groovy
  - file: /var/jenkins_jobs/lab-identity.groovy
