name: tiagolabs-local-ci

services:
  jenkins:
    build: .
    image: tiagolabs-local-jenkins:local
    restart: "no"
    ports:
      - "127.0.0.1:15180:8080"
    env_file:
      - ../../.local/local/ci/jenkins/.env
    environment:
      CASC_JENKINS_CONFIG: /var/jenkins_config/jenkins.yaml
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    volumes:
      - ../../.local/local/ci/jenkins/controller-home:/var/jenkins_home
      - ./jenkins.yaml:/var/jenkins_config/jenkins.yaml:ro
      - ./jobs/hero-association.groovy:/var/jenkins_jobs/hero-association.groovy:ro
      - ./jobs/lab-identity.groovy:/var/jenkins_jobs/lab-identity.groovy:ro
